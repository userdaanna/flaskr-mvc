{% extends 'base.html' %}
{% block header %}<h1 class="h3 mb-4">{% block title %}Novo Post{% endblock %}</h1>{% endblock %}
{% block content %}
  <div class="card shadow-sm"><div class="card-body">
    <form method="post" enctype="multipart/form-data">
      <div class="mb-3"><label for="title" class="form-label">Título</label><input name="title" id="title" class="form-control" required></div>
      <div class="mb-3"><label for="imagem_post" class="form-label">Imagem do Post (opcional)</label><input type="file" name="imagem_post" id="imagem_post" class="form-control" accept="image/*"></div>
      <div class="mb-3"><label for="body" class="form-label">Conteúdo</label><textarea name="body" id="body" rows="5" class="form-control"></textarea></div>
      <button type="submit" class="btn btn-primary">Publicar</button>
      <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div></div>
{% endblock %}
